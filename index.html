<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Планер автоматизации и MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Единая цветовая система для светлой и тёмной темы без рамок и теней между блоками */
    :root {
      --bg: #f6f7f9;
      --surface: #f6f7f9;
      --control-bg: #eef0f4;
      --text: #111827;
      --muted: #6b7280;
      --accent: #111827;
      --accent-text: #ffffff;
      --accent-soft: #10b981;
      --accent-soft-bg: rgba(16, 185, 129, 0.14);
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-text: #92400e;
      --danger: #dc2626;
      --divider: rgba(17, 24, 39, 0.08);
    }

    body.dark {
      --bg: #0f1115;
      --surface: #0f1115;
      --control-bg: #181c24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #f3f4f6;
      --accent-text: #111827;
      --accent-soft: #10b981;
      --accent-soft-bg: rgba(16, 185, 129, 0.16);
      --warn-bg: rgba(245, 158, 11, 0.18);
      --warn-text: #fbbf24;
      --danger: #f87171;
      --divider: rgba(243, 244, 246, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.45;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--control-bg);
      border-radius: 16px;
      padding: 24px;
    }

    .auth-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
    }

    .auth-sub {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .auth-field {
      margin-bottom: 12px;
    }

    .auth-field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .auth-error {
      color: var(--danger);
      font-size: 12px;
      margin-bottom: 10px;
      min-height: 18px;
    }

    .planner-shell {
      display: none;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 18px 20px 48px;
      background: var(--surface);
    }

    .workspace {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
    }

    /* Три горизонтальные колонки сверху без карточных рамок и теней */
    .top-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
      width: 100%;
    }

    /* Нижняя сетка: слева широкая колонка Контактов, справа объединённый блок План продаж + задачи/заметки/комментарии */
    .bottom-zones-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1.15fr);
      gap: 24px;
      align-items: start;
      width: 100%;
    }

    @media (max-width: 1240px) {
      .bottom-zones-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    @media (max-width: 1024px) {
      .top-columns {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .planner-shell {
        padding: 16px 14px 40px;
      }
    }

    .section-block {
      background: transparent;
      padding: 4px 2px;
      min-width: 0;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.more {
      background: var(--accent-soft-bg);
      color: #059669;
    }

    body.dark .badge.more {
      color: #34d399;
    }

    .badge.less {
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .counter {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .inputs-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .inputs-row.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .inputs-row.contacts-form {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 640px) {
      .inputs-row.contacts-form {
        grid-template-columns: 1fr;
      }
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: var(--text);
      outline: none;
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 10px;
      background: var(--control-bg);
      font-size: 13px;
    }

    .auth-card input[type="email"],
    .auth-card input[type="password"] {
      background: var(--bg);
    }

    textarea {
      resize: vertical;
      min-height: 64px;
    }

    button {
      border: none;
      background: var(--control-bg);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    button:hover {
      opacity: 0.85;
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    button.icon-btn {
      padding: 7px 11px;
      font-size: 15px;
      line-height: 1;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 8px;
      background: var(--control-bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-soft);
      width: 0%;
      transition: width 0.2s ease;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi {
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--control-bg);
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
    }

    .kpi-val {
      font-size: 16px;
      font-weight: 700;
      margin-top: 2px;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .client-list,
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .client-item,
    .task-item {
      background: var(--control-bg);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .client-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .client-meta-line {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
    }

    .check-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-soft);
      cursor: pointer;
      flex-shrink: 0;
    }

    .done-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .client-amount {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .client-overrides {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .client-overrides input {
      padding: 6px 8px;
      font-size: 12px;
      background: var(--bg);
    }

    .client-notes-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-top: 6px;
    }

    .client-notes-grid input {
      padding: 6px 8px;
      font-size: 12px;
      background: var(--bg);
    }

    .del-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 4px 6px;
      font-size: 14px;
    }

    .del-btn:hover {
      color: var(--danger);
      opacity: 1;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .cat-box {
      background: var(--control-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .cat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .link-btn {
      border: none;
      background: transparent;
      padding: 0;
      font-size: 12px;
      color: var(--muted);
      text-decoration: underline;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .chip {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--bg);
    }

    .chip.active {
      background: var(--accent-soft);
      color: #ffffff;
    }

    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      padding-left: 24px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 16px 10px;
      border-radius: 12px;
      background: var(--control-bg);
    }

    .calls-summary-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--control-bg);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .calls-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 12px;
    }

    .calls-stat-item strong {
      font-weight: 700;
    }

    .calls-goal-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .calls-goal-controls input[type="number"] {
      width: 78px;
      padding: 6px 8px;
      background: var(--bg);
      font-size: 12px;
    }

    .lead-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .leads-table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      background: var(--control-bg);
      padding: 6px;
    }

    .leads-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 840px;
    }

    .leads-table th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      padding: 8px 8px;
      border-bottom: 1px solid var(--divider);
    }

    .leads-table td {
      padding: 6px 6px;
      vertical-align: middle;
    }

    .leads-table td input[type="text"],
    .leads-table td select {
      background: var(--bg);
      padding: 6px 8px;
      font-size: 12px;
    }

    .phone-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .call-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 9px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }

    .call-link:hover {
      opacity: 0.88;
    }

    .general-notes-box {
      background: var(--control-bg);
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
    }

    .general-notes-title {
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    /* Единая строка управления в самом низу страницы */
    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      margin-top: 28px;
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-soft);
      flex-shrink: 0;
    }

    .sync-status {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Модальное окно уведомлений и подтверждений вместо alert/confirm */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .modal-box {
      background: var(--bg);
      color: var(--text);
      border-radius: 14px;
      padding: 18px;
      max-width: 420px;
      width: 100%;
    }

    .modal-message {
      font-size: 14px;
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <!-- Экран входа для доступа только авторизованному пользователю -->
  <div class="auth-shell" id="authShell">
    <form class="auth-card" id="loginForm">
      <h1 class="auth-title">Вход в планер</h1>
      <p class="auth-sub">Доступ к контактам и данным только после входа в аккаунт</p>
      <div class="auth-field">
        <label for="authEmailInput">Email</label>
        <input type="email" id="authEmailInput" required autocomplete="email" placeholder="mukaevsaidemin@gmail.com" />
      </div>
      <div class="auth-field">
        <label for="authPasswordInput">Пароль</label>
        <input type="password" id="authPasswordInput" required autocomplete="current-password" placeholder="Введите пароль" />
      </div>
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="primary" id="loginSubmitBtn" style="width: 100%;">Войти</button>
    </form>
  </div>

  <div class="planner-shell" id="plannerShell">
    <div class="workspace">
      <!-- Три горизонтальные колонки сверху -->
      <div class="top-columns">
        <!-- 1. План продаж, задачи, заметки и комментарии -->
        <section class="section-block" id="salesSection">
          <div class="section-head">
            <h2 class="section-title">1. План продаж, задачи, заметки и комментарии</h2>
            <span class="counter" id="salesCounter">0 /
